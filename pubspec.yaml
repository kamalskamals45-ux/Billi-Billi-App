name: billi_billi_video
description: Billi Billi video sharing app.
publish_to: "none"
version: 1.11.0+22

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  video_player: ^2.10.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.14.0
  firebase_app_check: ^0.4.7
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/billi_billi_logo.png
