name: Build Billi Billi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Backup Billi Billi Dart source
        shell: bash
        run: |
          rm -rf /tmp/billi_billi_lib_backup
          cp -a lib /tmp/billi_billi_lib_backup

      - name: Create Android platform
        shell: bash
        run: |
          # Generate Android files without losing the Billi Billi Dart source.
          flutter create --platforms=android --project-name billi_billi_video --org com.billibilli .
          rm -rf test

      - name: Restore Billi Billi Dart source and required Firebase files
        shell: bash
        run: |
          rm -rf lib
          cp -a /tmp/billi_billi_lib_backup lib

          # Older GitHub commits of this project omitted these two source files.
          # Restore the known-good copies so flutter analyze cannot fail with
          # Target of URI doesn't exist / undefined OnlineSocialService errors.
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          files = {
              'lib/firebase_options.dart': '',
              'lib/services/online_social_service.dart': '',
          }
          for filename, encoded in files.items():
              path = Path(filename)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f'RESTORED: {filename} ({path.stat().st_size} bytes)')
          PY2

          test -s lib/main.dart
          test -s lib/firebase_options.dart
          test -s lib/services/online_social_service.dart
          echo "Required Billi Billi Dart source files are ready."

      - name: Verify required Billi Billi assets
        shell: bash
        run: |
          test -s assets/billi_billi_logo.png
          test -f android/app/google-services.json
          echo "Billi Billi logo and Firebase configuration found."

      - name: Verify generated Android package
        shell: bash
        run: |
          grep -R -q 'com.billibilli.billi_billi_video' android || true
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts

      - name: Configure Android package, permissions and network security
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_package = "com.billibilli.billi_billi_video"
          new_package = "com.billibilli.video"

          for p in Path("android").rglob("*"):
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old_package in text:
                  p.write_text(text.replace(old_package, new_package), encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(marker, marker + "\n    " + permission, 1)

          security_dir = Path("android/app/src/main/res/xml")
          security_dir.mkdir(parents=True, exist_ok=True)
          (security_dir / "network_security_config.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          ''', encoding="utf-8")

          app_marker = "<application "
          network_attr = 'android:networkSecurityConfig="@xml/network_security_config"'
          if network_attr not in text:
              text = text.replace(app_marker, app_marker + network_attr + " ", 1)

          manifest.write_text(text, encoding="utf-8")
          PY
          grep -R -q 'com.billibilli.video' android
          if grep -R -q 'com.billibilli.billi_billi_video' android; then
            echo "ERROR: old Android package id remains"
            exit 1
          fi

      - name: Fix Android 15 edge-to-edge theme
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("android/app/src/main/res")
          attr = '<item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>'

          for folder in ("values", "values-night"):
              path = base / folder / "styles.xml"
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for theme in ("LaunchTheme", "NormalTheme"):
                  pattern = rf'(<style[^>]*name="{theme}"[^>]*>.*?)(</style>)'
                  match = re.search(pattern, text, re.DOTALL)
                  if match and attr not in match.group(1):
                      replacement = match.group(1) + f"        {attr}\n    " + match.group(2)
                      text = text[:match.start()] + replacement + text[match.end():]
              path.write_text(text, encoding="utf-8")

      - name: Configure Billi Billi launcher logo
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/billi_billi_logo.png android/app/src/main/res/drawable/billi_billi_logo.png
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/billi_billi_logo"')
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Configure Firebase Android app
        shell: bash
        run: |
          test -f android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text(encoding="utf-8")
          plugin = 'id("com.google.gms.google-services") version "4.5.0" apply false'
          if plugin not in text:
              text = text.replace('plugins {', 'plugins {\n    ' + plugin, 1)
          settings.write_text(text, encoding="utf-8")

          app = Path("android/app/build.gradle.kts")
          text = app.read_text(encoding="utf-8")
          plugin = 'id("com.google.gms.google-services")'
          if plugin not in text:
              text = text.replace('plugins {', 'plugins {\n    ' + plugin, 1)
          app.write_text(text, encoding="utf-8")
          PY

      - name: Update Kotlin Gradle plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/settings.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")([^"]+)(")',
              r'\g<1>2.3.0\g<3>',
              s,
              count=1,
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Configure release signing
        env:
          BILLIBILLI_KEYSTORE_BASE64: ${{ secrets.BILLIBILLI_KEYSTORE_BASE64 }}
          BILLIBILLI_KEYSTORE_PASSWORD: ${{ secrets.BILLIBILLI_KEYSTORE_PASSWORD }}
        run: |
          test -n "$BILLIBILLI_KEYSTORE_BASE64"
          test -n "$BILLIBILLI_KEYSTORE_PASSWORD"
          echo "$BILLIBILLI_KEYSTORE_BASE64" | base64 --decode > android/billibilli-release.jks

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          signing_block = '''    signingConfigs {
              create("release") {
                  storeFile = rootProject.file("billibilli-release.jks")
                  storePassword = System.getenv("BILLIBILLI_KEYSTORE_PASSWORD")
                  keyAlias = "billibilli"
                  keyPassword = System.getenv("BILLIBILLI_KEYSTORE_PASSWORD")
              }
          }
          '''
          if 'create("release")' not in s:
              s = s.replace('    buildTypes {', signing_block + '    buildTypes {', 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Get dependencies
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Verify Billi Billi Dart source before analysis
        shell: bash
        run: |
          test -s lib/main.dart
          test -s lib/firebase_options.dart
          test -s lib/services/online_social_service.dart
          echo "main.dart: $(wc -c < lib/main.dart) bytes"
          echo "firebase_options.dart: $(wc -c < lib/firebase_options.dart) bytes"
          echo "online_social_service.dart: $(wc -c < lib/services/online_social_service.dart) bytes"

      - name: Analyze Dart code
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/flutter_analyze.log
          status=${PIPESTATUS[0]}
          set -e

          # Flutter/Dart analyzer returns exit code 1 for warnings/lints too.
          # Continue when there are only warnings/info, but stop on real Dart errors.
          if grep -qE '(^|[[:space:]])error[[:space:]]•' /tmp/flutter_analyze.log; then
            echo "Dart analyzer found real errors."
            exit 1
          fi

          if [ "$status" -gt 1 ]; then
            echo "Dart analyzer failed unexpectedly with exit code $status."
            exit "$status"
          fi

          echo "Dart analyzer completed with warnings/info only; continuing to APK build."

      - name: Build release APK
        env:
          BILLIBILLI_KEYSTORE_PASSWORD: ${{ secrets.BILLIBILLI_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Billi-Billi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
